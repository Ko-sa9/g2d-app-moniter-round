# ワークフローの名称（GitHubのActionsタブに表示されるタイトル）
name: Deploy to Firebase Hosting on merge

# 実行タイミングの定義（mainブランチにマージ・プッシュされた時に自動実行）
on:
  push:
    branches:
      - main

# 実行するジョブ（作業単位）の定義
jobs:
  build_and_deploy:
    # 処理を実行するGitHub側の仮想サーバーOS（最新のUbuntu環境を使用）
    runs-on: ubuntu-latest

    # 順番に実行されるステップの定義
    steps:
      # 1. GitHubリポジトリから最新のソースコードを取得する処理
      - uses: actions/checkout@v4

      # ▼▼▼ 修正箇所：ここから（checkout と npm ci の間の部分） ▼▼▼
      # 2. 仮想サーバーにNode.js（v24）をセットアップする処理
      # ※すでに setup-node の記述がある場合は node-version を '24' に書き換えます
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # 手元のMacBookと同じNode.js 24（最新LTS）を指定
          cache: 'npm'       # パッケージをキャッシュして2回目以降のビルド時間を短縮
      # ▲▲▲ 修正箇所：ここまで ▲▲▲

      # 3. パッケージのインストールと本番用ビルドを実行する処理
      - run: npm ci && npm run build
        # ビルド時にVite（React）へ埋め込む環境変数の設定（既存のenvの内容をそのまま維持してください）
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # 4. ビルドされた静的ファイルをFirebase Hostingの本番環境（g2d-app-89646）へデプロイする処理
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_G2D_APP_89646 }}
          channelId: live
          projectId: g2d-app-89646
        env:
          GITHUB_TOKEN: ""
