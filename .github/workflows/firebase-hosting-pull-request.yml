# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

# ワークフローの名称（GitHubのActionsタブに表示されるタイトル）
name: Deploy to Firebase Hosting on PR

# 実行タイミングの定義（プルリクエストが作成・更新された時に自動実行）
on: pull_request

# GitHub Actionsに付与する権限の設定（PRへのチェック結果の書き込みやコメント権限）
permissions:
  checks: write
  contents: read
  pull-requests: write

# 実行するジョブ（作業単位）の定義
jobs:
  build_and_preview:
    # 外部のフォーク元ではなく、同じリポジトリ内のプルリクエストである場合のみ実行する安全条件
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    # 処理を実行するGitHub側の仮想サーバーOS（最新のUbuntu環境を使用）
    runs-on: ubuntu-latest

    # 順番に実行されるステップの定義
    steps:
      # 1. GitHubリポジトリからプルリクエスト対象のソースコードを取得する処理
      - uses: actions/checkout@v4

      # ▼▼▼ 修正箇所1：checkout と npm ci の間の部分（Node.js 24の指定を追加） ▼▼▼
      # 2. 仮想サーバーにNode.js（v24）をセットアップする処理
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # 手元のMacBookと同じNode.js 24（最新LTS）を指定
          cache: 'npm'       # パッケージをキャッシュして2回目以降のビルド時間を短縮
      # ▲▲▲ 修正箇所1：ここまで ▲▲▲

      # 3. パッケージのインストールとプレビュー用ビルド（distフォルダ生成）を実行する処理
      - run: npm ci && npm run build
        # ビルド時にVite（React）へ埋め込むFirebase環境変数の設定
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      # 4. ビルドされたファイルをFirebase Hostingのプレビュー環境へ一時デプロイする処理
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_G2D_APP_89646 }} # Firebaseデプロイ用の認証シークレット
          projectId: g2d-app-89646                                                      # デプロイ先のFirebaseプロジェクトID
        env:
          GITHUB_TOKEN: ""                                                              # 既存の空白設定を維持（※末尾にあった全角スペースは除去済み）